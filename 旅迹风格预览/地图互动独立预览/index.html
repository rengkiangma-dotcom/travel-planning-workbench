<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地图互动独立预览</title><link rel="stylesheet" href="preview.css"></head>
<body><header><div><strong>地图互动独立预览</strong><span>青岛 · 地点、路线与每日安排</span></div><div class="mode-switch"><button id="mock-mode">模拟数据</button><button id="live-mode">真实接口</button><b id="mode-label"></b></div></header>
<div class="banner">独立试验页面，不读取或修改正式旅行。模拟内容仅用于演示，不代表真实路线和费用。</div>
<main><aside><section><div class="eyebrow">WORKBENCH · 预览工作台</div><h2>想去的地方</h2><p class="hint">选择地点，收藏或加入当天安排。</p><div id="place-list" data-testid="place-list"></div></section><section><div class="section-title"><h2>第 1 天</h2><span>模拟时间线</span></div><label>出发时间 <input id="start-time" type="time" value="09:00"></label><div id="schedule" data-testid="schedule"></div><p class="hint">演示交通与停留时间均为模拟值；不自动保存路线。</p></section></aside>
<div class="map-area"><div id="map" data-testid="mock-map" aria-label="地图区域"></div><div id="map-message"></div><div id="mock-map-routes"></div><div class="map-badge" id="map-badge"></div><div id="context-menu" data-testid="context-menu" hidden></div>
<div class="floating"><div id="detail" data-testid="place-detail"></div><div class="route-panel"><div class="section-title"><h2>路线规划</h2><span id="route-source">路线草稿</span></div><div class="endpoints"><div><i>起</i><span data-testid="origin" id="origin"></span></div><div><i>终</i><span data-testid="destination" id="destination"></span></div></div><button id="home-origin" data-testid="home-origin" class="text-button">从模拟住宿出发</button><button id="swap" class="text-button">交换起终点</button><div id="waypoints" class="hint"></div><div class="modes"><button data-mode="driving" data-testid="mode-driving">驾车</button><button data-mode="transit" data-testid="mode-transit">公交</button><button data-mode="walking" data-testid="mode-walking">步行</button><button data-mode="riding" data-testid="mode-riding">骑行</button></div><label class="source-label">展示方式 <select id="engine"><option value="official">官方路线组件</option><option value="custom">自绘对照</option></select></label><button class="primary full" id="route-search" data-testid="route-search">查询路线</button><div id="status" data-testid="status" role="status"></div><div id="routes"></div><div id="official-panel"></div><p class="hint">正式查询的路线、时间和费用以接口实际返回为准；单次查看不会写入安排。</p></div></div></div></main><script src="preview.js"></script></body></html>
