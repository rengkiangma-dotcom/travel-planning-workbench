<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>高德地图嵌入试验</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px "Microsoft YaHei", sans-serif; color: #253342; background: #f2f5f7; }
    header { min-height: 64px; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; background: #fff; border-bottom: 1px solid #dce3e8; }
    h1 { margin: 0; font-size: 17px; }
    .hint { margin-left: auto; color: #607080; }
    main { height: calc(100vh - 65px); min-height: 440px; }
    iframe { display: block; border: 0; width: 100%; height: 100%; background: #eef2f5; }
  </style>
</head>
<body>
  <header>
    <h1>高德地图嵌入试验</h1>
    <span class="hint">杭州地图试验 · 如出现高德登录弹窗，可先关闭</span>
  </header>
  <main><iframe id="map" title="高德地图" src="https://uri.amap.com/marker?position=120.165%2C30.259&amp;name=%E6%9D%AD%E5%B7%9E&amp;coordinate=gaode&amp;callnative=0" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></main>
</body>
</html>
