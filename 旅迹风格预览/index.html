<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>行间 · 旅迹风格预览</title><link rel="stylesheet" href="vendor/leaflet.css"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="lvji.css"><link rel="stylesheet" href="workspace.css"><link rel="stylesheet" href="live-data.css"></head>
<body>
<aside class="rail"><a class="brand" href="#" aria-label="行间首页"><span class="brand-mark">行</span><span>行间<small>旅行规划工作台</small></span></a><div class="rail-label">我的旅行</div><div class="trip-card"><span class="trip-glyph">杭</span><div><strong>杭州，慢慢逛</strong><small>本地演示旅行</small></div></div><nav id="navigation" aria-label="规划模块"></nav><div class="rail-bottom"><span class="local-dot"></span> 仅保存在这台浏览器<button class="text-button" id="reset">重新开始</button></div></aside>
<div class="shell"><header class="topbar"><div class="breadcrumb">我的旅行 <span>/</span> <strong>规划工作台</strong></div><div class="top-actions"><span class="demo-badge">示例模式</span><span id="save-state">本地保存</span><button class="button outline" id="map-toggle" aria-expanded="false">展开地图 ↗</button></div></header>
<main id="main"><section id="entry"></section><div id="desk" hidden><div class="page-heading"><div><p class="eyebrow">一趟旅行，按你的节奏来</p><h1 id="trip-title">杭州，慢慢逛</h1><p id="trip-meta"></p></div><div class="weather-stamp"><span>杭</span><small>湖山之间<br>留一点空白</small></div></div><div class="progress-strip" id="summary-strip"></div><div class="workspace" id="workspace"><div class="planning"><div class="section-tabs" id="tabs"></div><div id="panel"></div><section class="assistant-box"><div class="assistant-title"><span class="assistant-symbol">✳</span><strong>一起想一想</strong><span>预设交互演示 · 未连接 AI</span></div><div id="chat-log" aria-live="polite"></div><div class="suggestions"><button data-chat="住宿优先">我想先看住哪里</button><button data-chat="安排轻松一点">把当前这天安排轻松一点</button><button data-chat="看看地图">看看地图上的路线</button></div><form id="chat-form"><input id="chat-input" aria-label="描述你的想法" placeholder="也可以自由输入想法，保存为规划备注…" maxlength="1000"><button class="send-button" aria-label="发送想法">↑</button></form></section></div><aside class="map-panel" id="map-panel" hidden><div class="map-heading"><div><strong>在地图上看看</strong><small id="map-caption">第 1 天 · 访问顺序</small></div><button id="map-fit" class="button outline small">查看全线</button></div><div id="map"></div><div id="map-fallback" hidden></div><div class="map-legend"><span class="route-dot"></span> 地点顺序连线 <span>非道路导航路线</span></div><div class="map-bottom"><strong id="map-route-label"></strong><p>底图需联网；票价、酒店和班次均为演示。地点连线不代表实际道路、耗时或可通行性。</p></div></aside></div></div></main><footer>行间 · 本地概念预览 <span>先把旅行想清楚，再出发。</span></footer></div><div id="toast" role="status"></div>
<dialog id="confirm-dialog"><h2 id="dialog-title">确认操作</h2><p id="dialog-text"></p><div class="dialog-actions"><button class="button outline" id="dialog-cancel">取消</button><button class="button primary" id="dialog-confirm">确认</button></div></dialog>
<script src="vendor/leaflet.js"></script><script src="data.js"></script><script src="app.js"></script><script src="entry-controls.js"></script><script src="create-entry.js"></script><script src="workspace.js"></script><script src="live-data.js"></script><script src="hotel-data.js"></script><script src="vendor/coordtransform.js"></script><script src="route-style.js"></script><script src="amap-map.js"></script><script src="map-interactions.js"></script><script src="map-statistics.js"></script></body></html>
